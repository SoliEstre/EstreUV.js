# EstreUV playground staging — nginx static serving.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ES modules: nginx maps .js → application/javascript by default.
    # PWA: allow the service worker to claim the root scope.
    location / {
        try_files $uri $uri/ =404;
        add_header Service-Worker-Allowed "/" always;
    }

    # node_modules (import-map targets) — long cache, immutable deps
    location /node_modules/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # never cache the service worker
    location = /serviceWorker.js {
        add_header Cache-Control "no-cache";
    }
}
